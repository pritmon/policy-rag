apiVersion: batch/v1
kind: Job
metadata:
  name: policy-rag-ingest
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: policy-rag-sa
      restartPolicy: OnFailure
      containers:
        - name: ingest
          image: 020262236277.dkr.ecr.us-east-1.amazonaws.com/policy-rag:latest
          command: ["python", "ingestion/ingest.py"]
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@pgvector:5432/policyrag
            - name: AWS_REGION
              value: us-east-1
            - name: BEDROCK_EMBED_MODEL_ID
              value: amazon.titan-embed-text-v2:0
            # Gemini provider (temporary while Bedrock quota is restored)
            - name: EMBED_PROVIDER
              value: gemini
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: api_key
            - name: EMBED_DIM
              value: "768"
            - name: LANGFUSE_PUBLIC_KEY
              value: ""
            - name: LANGFUSE_SECRET_KEY
              value: ""
