apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-rag-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-rag-app
  template:
    metadata:
      labels:
        app: policy-rag-app
    spec:
      serviceAccountName: policy-rag-sa
      containers:
        - name: app
          image: 020262236277.dkr.ecr.us-east-1.amazonaws.com/policy-rag:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@pgvector:5432/policyrag
            - name: AWS_REGION
              value: us-east-1
            - name: BEDROCK_LLM_MODEL_ID
              value: us.amazon.nova-micro-v1:0
            - name: BEDROCK_EMBED_MODEL_ID
              value: amazon.titan-embed-text-v2:0
            # Gemini provider (temporary while Bedrock quota is restored).
            # The API key lives in a k8s secret, never in this file.
            - name: LLM_PROVIDER
              value: gemini
            - name: EMBED_PROVIDER
              value: gemini
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: api_key
            - name: EMBED_DIM
              value: "768"
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: public_key
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: secret_key
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: policy-rag-svc
spec:
  type: LoadBalancer
  selector:
    app: policy-rag-app
  ports:
    - port: 80
      targetPort: 8000
