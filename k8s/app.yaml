apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-rag-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-rag-app
  template:
    metadata:
      labels:
        app: policy-rag-app
    spec:
      serviceAccountName: policy-rag-sa
      containers:
        - name: app
          image: ECR_URL_PLACEHOLDER:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@pgvector:5432/policyrag
            - name: AWS_REGION
              value: us-east-1
            - name: BEDROCK_LLM_MODEL_ID
              value: anthropic.claude-haiku-4-5-20251001-v1:0
            - name: BEDROCK_EMBED_MODEL_ID
              value: cohere.embed-english-v3
            - name: EMBED_DIM
              value: "1024"
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: public_key
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: secret_key
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: policy-rag-svc
spec:
  type: LoadBalancer
  selector:
    app: policy-rag-app
  ports:
    - port: 80
      targetPort: 8000
