# serviceaccount.yaml — The app's "ID card" inside the cluster.
#
# A ServiceAccount is an identity that pods carry. The magic is the
# annotation below: it links this Kubernetes identity to an AWS IAM role
# (created by infra/iam.tf). This trick is called IRSA.
#
# Result: any pod using this service account automatically gets AWS
# permissions (e.g. to call Bedrock) — with NO passwords or keys stored
# anywhere. AWS recognises the pod by its ID card.
#
# Used by: k8s/app.yaml and k8s/ingest-job.yaml (serviceAccountName: policy-rag-sa)

apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-rag-sa
  annotations:
    # "Pods carrying this ID card may use this AWS IAM role"
    eks.amazonaws.com/role-arn: arn:aws:iam::020262236277:role/policy-rag-app-irsa
